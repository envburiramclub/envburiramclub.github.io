    <style>
      html, body { height: 100%; margin: 0; background: #f4f8f7; }
      #app {
        position: fixed; inset: 0; display: block;
        width: 100%; height: 100%; border: 0; background: transparent;
      }
      .note {
        position: fixed; inset: 0; z-index: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; padding: 24px; text-align: center; box-sizing: border-box;
        font: 16px/1.6 Sarabun, "Noto Sans Thai", system-ui, sans-serif; color: #1f2937;
        background: #f4f8f7;
      }
      .note[hidden] { display: none; }
      .note a { color: #0f766e; font-weight: 600; }
      .spin {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #cfe3df; border-top-color: #0f766e;
        animation: spin 0.8s linear infinite;
      }
      .slow { font-size: 14px; color: #4b5563; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    </style>
  </head>
  <body>
    <div class="note" id="loading" role="status">
      <div class="spin" aria-hidden="true"></div>
      <div>กำลังดำเนินการ...</div>
      <div class="slow" id="slow" hidden></div>
    </div>
    <noscript>
      <div class="note">กรุณาเปิดใช้งาน JavaScript ในเบราว์เซอร์เพื่อใช้งานระบบรับสมัครสมาชิก</div>
    </noscript>
    <script>
      (function () {
        "use strict";
        
        let EXEC_URL = "https://script.google.com/macros/s/AKfycbyU041meiZ6klQSLnsYfbTwc2tv21OyO3Dx2ji3n2qvKs6XXxhWZAVyI0Rg0bHOdEO1_A/exec";
    
        let EXEC_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
        
        let BASE = location.origin + location.pathname;
    
        let loading = document.getElementById("loading");
        let slow = document.getElementById("slow");
    
        function note(title, linkText, linkHref, linkTarget) {
          loading.hidden = false;
          loading.innerHTML = "";
          let t = document.createElement("div");
          t.textContent = title;
          loading.appendChild(t);
          if (linkHref) {
            let a = document.createElement("a");
            a.href = linkHref;
            a.textContent = linkText;
            a.target = linkTarget || "_self";
            if (a.target === "_blank") a.rel = "noopener";
            loading.appendChild(a);
          }
        }
        
        if (window.top !== window.self) {
          note("หน้านี้ถูกนำไปแสดงซ้อนในเว็บไซต์อื่น เพื่อความปลอดภัยจึงไม่แสดงเนื้อหา",
            "เปิดระบบรับสมัครสมาชิกในหน้าต่างใหม่", location.href, "_blank");
          return;
        }
    
        if (!EXEC_RE.test(EXEC_URL)) {
          return;
        }
    
        let q = new URLSearchParams(location.search);
        q.delete("host");
        q.set("host", BASE);
    
        let frame = document.createElement("iframe");
        frame.id = "app";
        frame.title = "ระบบรับสมัครสมาชิก ชมรมอนามัยสิ่งแวดล้อมจังหวัดบุรีรัมย์";
        frame.setAttribute("allow", "clipboard-write; fullscreen");
    
        function fromApp(e) {
          if (!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(e.origin)) return false;
          let w = e.source;
          for (let i = 0; w && i < 6; i++) {
            if (w === frame.contentWindow) return true;
            if (w === w.parent) break;
            w = w.parent;
          }
          return false;
        }
    
        function safeTarget(url) {
          return typeof url === "string" && url.length < 2000 &&
            !/[\s"'<>\\]/.test(url) &&
            (url === BASE || url.indexOf(BASE + "?") === 0);
        }
    
        window.addEventListener("message", function (e) {
          if (!fromApp(e)) return;
          let d = e.data || {};
          if (d.type === "brp:hello") {
            e.source.postMessage({ type: "brp:host-ack" }, e.origin);
            if (typeof d.title === "string" && d.title) document.title = d.title.slice(0, 200);
            loading.hidden = true;
          } else if (d.type === "brp:navigate" && safeTarget(d.url)) {
            if (d.replace) location.replace(d.url);
            else location.assign(d.url);
          }
        });
    
        setTimeout(function () {
          if (loading.hidden) return;
          slow.hidden = false;
          slow.textContent = "ใช้เวลานานกว่าปกติ กรุณารีเฟรช (Refresh) หน้าจอ หากยังแสดงข้อความนี้ ให้แจ้งผู้ดูแลระบบด่วน!!";
        }, 15000);
    
        frame.src = EXEC_URL + "?" + q.toString();
        document.body.appendChild(frame);
      })();
    </script>
  </body>
